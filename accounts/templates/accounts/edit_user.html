{% extends "dashboard/dashboard.html" %}

<!-- Start Content-->
{% block title %}Edit Users{% endblock title %}
<!-- Start Content-->{% block content %}
<!-- Start Content-->
<div class="container-fluid">
  <div class="py-3 d-flex align-items-sm-center flex-sm-row flex-column">
    <div class="flex-grow-1">
      <h4 class="fs-18 fw-semibold m-0">User Edit</h4>
    </div>

    <div class="text-end">
      <ol class="breadcrumb m-0 py-0">
        <li class="breadcrumb-item">
          <a href="{% url 'users' %}">Users</a>
        </li>
        <li class="breadcrumb-item active">{{user}}</li>
      </ol>
    </div>
  </div>

  <div class="row">
    <form method="post">
      {% csrf_token %}
      <div class="row">
        <div class="col-lg-6 col-xl-6">
          <div class="card border">
            <div class="card-header">
              <div class="row align-items-center">
                <div class="col">
                  <h4 class="card-title mb-0">Edit Profile</h4>
                </div>
                <!--end col-->
              </div>
            </div>

            <div class="card-body">
              <div class="form-group mb-3 row">
                <label class="form-label">First Name</label>
                <div class="col-lg-12 col-xl-12">{{form.first_name}}</div>
              </div>

              <div class="form-group mb-3 row">
                <label class="form-label">Last Name</label>
                <div class="col-lg-12 col-xl-12">{{form.last_name}}</div>
              </div>

              <div class="form-group mb-3 row">
                <label class="form-label">Username</label>
                <div class="col-lg-12 col-xl-12">
                  <div class="input-group">
                    <span class="input-group-text">@</span>
                    {{form.username}}
                  </div>
                </div>
              </div>

              <div class="form-group mb-3 row">
                <label class="form-label">Email Address</label>
                <div class="col-lg-12 col-xl-12">
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="mdi mdi-email"></i
                    ></span>
                    {{form.email}}
                  </div>
                </div>
              </div>
            </div>
            <!--end card-body-->
          </div>
        </div>

        <div class="col-lg-6 col-xl-6">
          <div class="card border mb-0">
            <div class="card-header">
              <div class="row align-items-center">
                <div class="col">
                  <h4 class="card-title mb-0">Change Password</h4>
                </div>
                <!--end col-->
              </div>
            </div>

            <div class="card-body mb-0">
              <div class="form-group mb-3 row">
                <label class="form-label">New Password</label>
                <div class="col-lg-12 col-xl-12">
                  <input
                    class="form-control"
                    type="password"
                    name="new_password"
                    placeholder="New Password"
                  />
                </div>
              </div>
              <div class="form-group mb-3 row">
                <label class="form-label">Confirm Password</label>
                <div class="col-lg-12 col-xl-12">
                  <input
                    class="form-control"
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                  />
                </div>
              </div>

              <div class="form-group row">
                <div class="col-lg-12 col-xl-12">
                  <button type="submit" class="btn btn-primary mb-2 mb-md-0">
                    Save Changes
                  </button>
                  <a href="{% url 'users' %}" class="btn btn-danger">Cancel</a>
                </div>
              </div>
            </div>
            <!--end card-body-->
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
<!-- container-fluid -->

{% endblock %}
